/* Dark gradient overlay with a gently breathing #000c80 glow */
.overlay {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(ellipse at 50% 20%, rgba(89, 78, 200, 0.1803921568627451), transparent 60%),
        linear-gradient(180deg,
            rgba(9, 11, 20, 0.34901960784313724) 0%,
            rgba(10, 10, 20, 0.30196078431372547) 45%,
            rgba(5, 5, 13, 0.8784313725490196) 100%);
    background-size: cover;
    background-position: center;
    animation: glow-breathe 8s ease-in-out infinite;
}

/* Floating firefly particles */
#fireflies {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
}

.container {
    max-width: 680px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Profile photo with a rotating gradient ring */
.avatar {
    position: relative;
    width: 122px;
    height: 122px;
    margin-bottom: 1.1rem;
    border-radius: 50%;
    opacity: 0;
    animation:
        pop-in 0.9s var(--ease-out) 0.3s forwards,
        float 6s ease-in-out 1.2s infinite;
}

.avatar::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--mint), #ffffff, var(--leaf), var(--sand), var(--mint));
    animation: spin 6s linear infinite;
    filter: drop-shadow(0 0 12px rgba(126, 146, 240, 0.5490196078431373));
}

.avatar::after {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px solid rgba(126, 137, 239, 0.5019607843137255);
    animation: pulse-ring 2.6s ease-out 1.2s infinite;
    opacity: 0;
}

.profile-img {
    position: absolute;
    inset: 5px;
    width: calc(100% - 10px);
    height: calc(100% - 10px);
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #0f1f17;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    z-index: 1;
}

.username {
    font-size: 1.4rem;
    font-weight: 800;
    margin-bottom: 0.35rem;
    letter-spacing: 0.5px;
    text-align: center;
    background: linear-gradient(90deg, #ffffff 0%, #ffffff 35%, var(--mint) 50%, #ffffff 65%, #ffffff 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.55));
    opacity: 0;
    animation:
        fade-up 0.8s var(--ease-out) 0.6s forwards,
        shimmer 5s linear 1.4s infinite;
}

.subtitle {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--sand);
    margin-bottom: 2rem;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    opacity: 0;
    animation: fade-up 0.8s var(--ease-out) 0.75s forwards;
}

.subtitle::before,
.subtitle::after {
    content: "";
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--sand));
    animation: line-grow 0.9s var(--ease-out) 1.1s forwards;
}

.subtitle::after {
    background: linear-gradient(90deg, var(--sand), transparent);
}

.link-container {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.link-btn {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.65rem;
    width: 100%;
    padding: 1rem 3rem;
    text-align: center;
    background-color: rgba(255, 255, 255, 0.14);
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-weight: 600;
    font-size: 1rem;
    border: 1px solid rgba(255, 255, 255, 0.3);
    transition:
        background-color 0.35s ease,
        color 0.35s ease,
        transform 0.35s var(--ease-out),
        box-shadow 0.35s ease,
        border-color 0.35s ease;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    opacity: 0;
    translate: 0 24px;
    scale: 0.96;
    animation: fade-up-btn 0.7s var(--ease-out) forwards;
    animation-delay: calc(1s + var(--i) * 0.12s);
    -webkit-tap-highlight-color: transparent;
}

/* Light sweep that glides across each button periodically */
.link-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(110deg, transparent, rgba(255, 255, 255, 0.35), transparent);
    transform: skewX(-20deg);
    animation: sweep 6s ease-in-out infinite;
    animation-delay: calc(2.5s + var(--i) * 0.4s);
    pointer-events: none;
}

.link-btn svg {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    fill: currentColor;
    transition: transform 0.45s var(--ease-out);
}

.link-btn .arrow {
    position: absolute;
    right: 1.4rem;
    opacity: 0;
    transform: translateX(-8px);
    transition: opacity 0.3s ease, transform 0.35s var(--ease-out);
}

.link-btn:hover,
.link-btn:focus-visible {
    background-color: #ffffff;
    color: #121630;
    border-color: #ffffff;
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 10px 28px rgba(80, 82, 200, 0.45098039215686275);
    outline: none;
}

.link-btn:hover svg:not(.arrow),
.link-btn:focus-visible svg:not(.arrow) {
    transform: scale(1.2) rotate(-8deg);
}

.link-btn:hover .arrow,
.link-btn:focus-visible .arrow {
    opacity: 1;
    transform: translateX(0);
}

.link-btn:active {
    transform: translateY(-1px) scale(0.99);
}

/* Click ripple */
.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(80, 90, 200, 0.4);
    transform: scale(0);
    animation: ripple 0.65s ease-out forwards;
    pointer-events: none;
}

footer {
    margin-top: 3rem;
    font-size: 0.85rem;
    letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    opacity: 0;
    animation: fade-in-soft 1.2s ease 1.8s forwards;
}

/* ---------- Keyframes ---------- */
@keyframes bg-reveal {
    to { opacity: 1; transform: scale(1.05); }
}

@keyframes ken-burns {
    from { transform: scale(1.05) translate(0, 0); }
    to   { transform: scale(1.14) translate(-1.5%, -2%); }
}

@keyframes glow-breathe {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.8; }
}

@keyframes pop-in {
    0%   { opacity: 0; transform: scale(0.5) rotate(-12deg); }
    70%  { opacity: 1; transform: scale(1.06) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes float {
    0%, 100% { translate: 0 0; }
    50%      { translate: 0 -6px; }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes pulse-ring {
    0%   { transform: scale(0.9); opacity: 0.8; }
    100% { transform: scale(1.35); opacity: 0; }
}

@keyframes fade-up {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}

@keyframes fade-up-btn {
    to { opacity: 1; translate: 0 0; scale: 1; }
}

@keyframes shimmer {
    from { background-position: 100% 0; }
    to   { background-position: -150% 0; }
}

@keyframes line-grow {
    to { width: 28px; }
}

@keyframes sweep {
    0%, 70% { left: -60%; }
    100%    { left: 130%; }
}

@keyframes ripple {
    to { transform: scale(2.5); opacity: 0; }
}

@keyframes fade-in-soft {
    to { opacity: 0.8; }
}

/* Respect visitors who prefer less motion */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        animation-delay: 0s !important;
        transition-duration: 0.01ms !important;
    }
    #fireflies { display: none; }
}
</style>

<script>
// Click ripple on link buttons
document.querySelectorAll(".link-btn").forEach(function (btn) {
    btn.addEventListener("pointerdown", function (e) {
        var rect = btn.getBoundingClientRect();
        var size = Math.max(rect.width, rect.height);
        var r = document.createElement("span");
        r.className = "ripple";
        r.style.width = r.style.height = size + "px";
        r.style.left = (e.clientX - rect.left - size / 2) + "px";
        r.style.top = (e.clientY - rect.top - size / 2) + "px";
        btn.appendChild(r);
        r.addEventListener("animationend", function () { r.remove(); });
    });
});

// Fireflies / waterfall mist drifting upward
(function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    var canvas = document.getElementById("fireflies");
    var ctx = canvas.getContext("2d");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w, h, particles = [];

    function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function spawn(randomY) {
        return {
            x: Math.random() * w,
            y: randomY ? Math.random() * h : h + 10,
            r: Math.random() * 2.2 + 0.6,
            vy: Math.random() * 0.35 + 0.15,
            drift: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.01 + 0.005,
            phase: Math.random() * Math.PI * 2,
            hue: Math.random() < 0.6 ? "126, 240, 176" : "255, 244, 214"
        };
    }

    function init() {
        resize();
        var count = Math.round(Math.min(70, (w * h) / 14000));
        particles = [];
        for (var i = 0; i < count; i++) particles.push(spawn(true));
    }

    function tick() {
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            p.y -= p.vy;
            p.drift += p.speed;
            p.phase += 0.03;
            p.x += Math.sin(p.drift) * 0.4;
            if (p.y < -10) particles[i] = p = spawn(false);

            var alpha = 0.25 + (Math.sin(p.phase) + 1) * 0.3;
            var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
            g.addColorStop(0, "rgba(" + p.hue + "," + alpha + ")");
            g.addColorStop(1, "rgba(" + p.hue + ",0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
            ctx.fill();
        }
        requestAnimationFrame(tick);
    }

    window.addEventListener("resize", resize);
    init();
    requestAnimationFrame(tick);
})();

// Subtle parallax on the background as the pointer moves
(function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var bg = document.querySelector(".bg");
    window.addEventListener("pointermove", function (e) {
        if (e.pointerType !== "mouse") return;
        var x = (e.clientX / window.innerWidth - 0.5) * -14;
        var y = (e.clientY / window.innerHeight - 0.5) * -14;
        bg.style.translate = x + "px " + y + "px";
    });
})();
</script>
